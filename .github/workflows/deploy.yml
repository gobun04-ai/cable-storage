name: GitHub Pages 배포

# main 브랜치에 올라오면 빌드해서 배포한다.
# 수동으로 다시 배포하고 싶을 때는 Actions 탭에서 직접 실행할 수도 있다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 에 올리는 데 필요한 최소 권한만 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 한 번에 하나만 돌린다. 진행 중인 것은 끊지 않고 끝까지 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드
        # GitHub Pages 는 https://<계정>.github.io/<저장소>/ 로 서비스되므로
        # 저장소 이름을 그대로 하위 경로로 넣는다. 저장소 이름이 바뀌어도 따라간다.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Pages 설정 읽기
        uses: actions/configure-pages@v5

      - name: 결과물 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
